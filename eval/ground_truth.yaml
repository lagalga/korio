# Ground truth para evaluación detector de contradicciones · Korio TFM
# Construido a partir de:
#   - data-synthetic/demo-tfm/README.md (intención autoral explícita)
#   - Metadata de cada doc (campos `supersedes`, `note: Contradice...`)
#
# Niveles de detector:
#   ingest      → arista CONTRADICTS creada en grafo durante ingesta
#   query_time  → silent conflict detectado al hacer query (similitud zona gris)
#                  Estos pares NO esperan arista en grafo, se evalúan aparte.
#
# Las filenames son basename sin extensión, matching contra Document.filename
# en FalkorDB (después de ingesta, conserva extensión real).

tenants:
  delos:  "a0000000-0000-0000-0000-000000000001"
  garcia: "b0000000-0000-0000-0000-000000000002"

