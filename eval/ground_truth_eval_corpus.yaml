# Ground truth para corpus eval-specific (eval-corpus/)
# 12 documentos · 6 pares positivos (contradicción ambigua, pending-eligible)
# + 6 pares negativos (mismo tenant/space, temas distintos)
#
# Diseño: misma fecha, mismo autor, misma autoridad → detector NO puede
# auto-resolver → resolution='pending' → conflict_review persistente → métricas
# limpias.

tenants:
  delos: "a0000000-0000-0000-0000-000000000001"

# UUID inventado para el nuevo space Eval (debe crearse en Supabase antes del ingest)
spaces:
  eval: "a1000000-0000-0000-0000-000000000099"

positives:

  - id: EP1
    tenant: delos
    space: eval
    doc_a: "eval_pol_teletrabajo_a"
    doc_b: "eval_pol_teletrabajo_b"
    contradiction: "3 días/sem vs 2 días/sem"

