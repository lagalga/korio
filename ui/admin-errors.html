<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korio · Admin · Errores n8n</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    /* Estilos locales (no usamos css/styles.css porque este es panel admin) */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }
    header.topbar {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header.topbar h1 { margin: 0; font-size: 1.1rem; }
    header.topbar small { color: #94a3b8; }
    main { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
    .controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .controls input, .controls select, .controls button {
      padding: 0.5rem 0.75rem;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .controls input[type="password"] { width: 240px; }
    .controls button {
      background: #2563eb;
      border-color: #2563eb;
      cursor: pointer;
    }
    .controls button:hover { background: #1d4ed8; }
    .controls label { color: #cbd5e1; display: flex; align-items: center; gap: 0.35rem; }
    .counter { color: #94a3b8; font-size: 0.85rem; margin-left: auto; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #334155; vertical-align: top; }
    th {
      background: #0f172a;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr.reviewed { opacity: 0.5; }
    td.workflow { font-weight: 600; max-width: 240px; }
    td.message {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.78rem;
      max-width: 480px;
      word-break: break-word;
      color: #fca5a5;
    }
    td.node {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.78rem;
      color: #93c5fd;
    }
    td.captured { color: #94a3b8; font-size: 0.78rem; white-space: nowrap; }
    td.actions { white-space: nowrap; }
    .btn-action {
      padding: 0.35rem 0.7rem;
      border: 1px solid #475569;
      background: #334155;
      color: #e2e8f0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      margin-right: 0.35rem;
      text-decoration: none;
      display: inline-block;
    }
    .btn-action:hover { background: #475569; }
    .btn-review { background: #16a34a; border-color: #16a34a; }
    .btn-review:hover { background: #15803d; }
    .btn-link { background: #1e3a8a; border-color: #1e3a8a; }

    .status {
      margin: 0.5rem 0;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .status.error { background: #7f1d1d; color: #fecaca; }
    .status.ok { background: #14532d; color: #bbf7d0; }
    .empty { text-align: center; padding: 2rem; color: #94a3b8; }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🚨 Korio · Errores n8n</h1>
      <small>Panel admin · tabla <code>n8n_errors</code></small>
    </div>
    <a class="btn-action btn-link" href="/ui">← Volver al chat</a>
  </header>

  <main>
    <div class="controls">
      <input type="password" id="admin-key" placeholder="X-Korio-Admin-Key">
      <label><input type="checkbox" id="only-unreviewed" checked> Solo no revisados</label>
      <input type="text" id="workflow-filter" placeholder="workflow_id (opcional)">
      <button id="refresh-btn">Recargar</button>
      <span class="counter" id="counter"></span>
    </div>

    <div id="status"></div>

    <table id="errors-table">
      <thead>
        <tr>
          <th>Capturado</th>
          <th>Workflow</th>
          <th>Nodo</th>
          <th>Mensaje</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="errors-body">
        <tr><td colspan="5" class="empty">Introduce admin key y pulsa Recargar.</td></tr>
      </tbody>
    </table>
  </main>

  <script>
    'use strict';

    const ADMIN_KEY_STORAGE = 'korio.adminKey';

    const $key = document.getElementById('admin-key');
    const $only = document.getElementById('only-unreviewed');
    const $wf = document.getElementById('workflow-filter');
    const $refresh = document.getElementById('refresh-btn');
    const $body = document.getElementById('errors-body');
    const $counter = document.getElementById('counter');
    const $status = document.getElementById('status');

    // Persistir admin key en sessionStorage (no localStorage: no queremos
    // que sobreviva a cerrar el navegador).
    const saved = sessionStorage.getItem(ADMIN_KEY_STORAGE);
    if (saved) $key.value = saved;
    $key.addEventListener('change', () => {
      sessionStorage.setItem(ADMIN_KEY_STORAGE, $key.value);
    });

    function setStatus(msg, type) {
      $status.innerHTML = msg ? `<div class="status ${type || ''}">${msg}</div>` : '';
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'medium' });
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function loadErrors() {
      const key = $key.value.trim();
      if (!key) {
        setStatus('Introduce la admin key.', 'error');
        return;
      }
      sessionStorage.setItem(ADMIN_KEY_STORAGE, key);

      const params = new URLSearchParams({
        only_unreviewed: $only.checked ? 'true' : 'false',
        limit: '200',
      });
      const wfId = $wf.value.trim();
      if (wfId) params.set('workflow_id', wfId);

      setStatus('Cargando…');
      try {
        const res = await fetch(`/admin/errors?${params}`, {
          headers: { 'X-Korio-Admin-Key': key },
        });
        if (!res.ok) {
          const txt = await res.text();
          setStatus(`Error ${res.status}: ${txt}`, 'error');
          return;
        }
        const data = await res.json();
        renderErrors(data.errors || []);
        $counter.textContent = `${data.count} errores`;
        setStatus('', null);
      } catch (e) {
        setStatus(`Error de red: ${e.message}`, 'error');
      }
    }

    function renderErrors(errors) {
      if (!errors.length) {
        $body.innerHTML = '<tr><td colspan="5" class="empty">Sin errores con esos filtros. 🎉</td></tr>';
        return;
      }
      $body.innerHTML = errors.map(e => {
        const wfUrl = `https://n8n.korio.es/workflow/${encodeURIComponent(e.workflow_id || '')}` +
                      (e.execution_id ? `/executions/${encodeURIComponent(e.execution_id)}` : '');
        const reviewed = !!e.reviewed_at;
        return `
          <tr class="${reviewed ? 'reviewed' : ''}" data-id="${e.id}">
            <td class="captured">${fmtDate(e.captured_at)}</td>
            <td class="workflow">
              ${escapeHtml(e.workflow_name || '(sin nombre)')}<br>
              <small style="color:#64748b">${escapeHtml(e.workflow_id || '')}</small>
            </td>
            <td class="node">${escapeHtml(e.error_node_name || '—')}</td>
            <td class="message">${escapeHtml((e.error_message || '').substring(0, 400))}</td>
            <td class="actions">
              <a class="btn-action btn-link" href="${wfUrl}" target="_blank" rel="noopener">Ver en n8n</a>
              ${reviewed
                ? `<span style="color:#bbf7d0">✅ ${escapeHtml(e.reviewed_by || 'admin')}</span>`
                : `<button class="btn-action btn-review" data-action="review" data-id="${e.id}">Marcar reviewed</button>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    async function reviewError(errorId) {
      const key = $key.value.trim();
      if (!key) return;
      try {
        const res = await fetch(`/admin/errors/${errorId}/review`, {
          method: 'POST',
          headers: {
            'X-Korio-Admin-Key': key,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ reviewed_by: 'admin-ui' }),
        });
        if (!res.ok) {
          const txt = await res.text();
          setStatus(`Error ${res.status}: ${txt}`, 'error');
          return;
        }
        setStatus('Marcado como revisado.', 'ok');
        loadErrors();
      } catch (e) {
        setStatus(`Error de red: ${e.message}`, 'error');
      }
    }

    $refresh.addEventListener('click', loadErrors);
    $body.addEventListener('click', evt => {
      const btn = evt.target.closest('button[data-action="review"]');
      if (btn) reviewError(btn.dataset.id);
    });
  </script>
</body>
</html>
