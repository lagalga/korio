<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Korio — Grafo de conocimiento</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #f1f5f9; color: #1e293b;
      overflow: hidden;
    }

    .topbar {
      background: #ffffff; border-bottom: 1px solid #e2e8f0;
      padding: 0 20px;
      display: flex; align-items: center; gap: 12px;
      height: 52px;
      white-space: nowrap;
      overflow-x: auto;
    }
    .topbar__logo {
      height: 28px; width: auto; display: block; flex-shrink: 0;
    }
    .topbar__sep  { width: 1px; height: 22px; background:#e2e8f0; flex-shrink: 0; }
    .topbar__chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px; background: #f1f5f9; border-radius: 6px;
      font-size: 12px; color: #475569; font-weight: 500; flex-shrink: 0;
    }
    .topbar label {
      font-size: 12px; color: #64748b; flex-shrink: 0;
    }
    .topbar select {
      font-size: 13px; padding: 5px 8px; border: 1px solid #cbd5e1;
      border-radius: 6px; background: white; color: #1e293b;
      flex-shrink: 0;
    }
    .topbar__right {
      margin-left: auto; display: flex; gap: 14px; align-items: center;
      font-size: 12px; color:#64748b; flex-shrink: 0;
    }
    .topbar a { color: #5B6AF5; text-decoration: none; font-size: 13px; }
    .topbar a:hover { text-decoration: underline; }

    .container {
      display: flex;
      width: 100%;
      height: calc(100vh - 52px);
    }
    #network {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      background: white;
      position: relative;
    }
    .sidepanel {
      width: 260px;
      flex: 0 0 260px;
      background: white;
      border-left: 1px solid #e2e8f0;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .sidepanel { display: none; }
    }
    .panel__section h3 {
      font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
      color: #64748b; margin: 0 0 10px 0; font-weight: 600;
    }
    .legend { display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .legend__item { display: flex; align-items: center; gap: 8px; }
    .legend__dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .contradiction-list { display: flex; flex-direction: column; gap: 10px; }
    .contradiction {
      background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px;
      padding: 10px 12px; font-size: 12px; line-height: 1.5;
      cursor: pointer; transition: all 0.15s ease;
    }
    .contradiction:hover {
      background: #ffedd5; border-color: #fb923c; transform: translateX(-2px);
      box-shadow: -2px 2px 6px rgba(220, 38, 38, 0.15);
    }
    .contradiction.is-active {
      background: #fed7aa; border-color: #dc2626;
      box-shadow: -2px 2px 8px rgba(220, 38, 38, 0.25);
    }
    .contradiction__pred { font-weight: 600; color: #92400e; margin-bottom: 4px; }
    .contradiction__vals { color: #1e293b; }
    .contradiction__vals em { color: #475569; font-style: normal; font-size: 11px; }
    .contradiction__hint {
      margin-top: 6px; font-size: 10px; color: #b45309;
      font-style: italic; display: none;
    }
    .contradiction:hover .contradiction__hint { display: block; }
    .stats { font-size: 12px; color: #475569; }
    .stats strong { color: #161632; font-size: 14px; }
    .empty {
      text-align: center; color: #94a3b8; font-size: 13px; padding: 28px 12px;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <a href="/" title="Inicio Korio">
      <img class="topbar__logo" src="assets/img/logo.svg" alt="Korio">
    </a>
    <span class="topbar__sep"></span>
    <span class="topbar__chip">🕸 Grafo de conocimiento</span>

    <span class="topbar__sep"></span>
    <label style="font-size:12px;color:#64748b;">Tenant</label>
    <select id="tenant-select">
      <option value="delos">Clínica Delos</option>
      <option value="garcia">Despacho García</option>
    </select>

    <label style="font-size:12px;color:#64748b;">Usuario</label>
    <select id="user-select"></select>

    <div class="topbar__right">
      <span id="status-text">Cargando…</span>
      <a href="/ui">← Volver a la app</a>
    </div>
  </div>

  <!-- Layout -->
  <div class="container">
    <div id="network"></div>

    <aside class="sidepanel">
      <div class="panel__section">
        <h3>Estadísticas</h3>
        <div class="stats" id="stats">
          <strong>—</strong> nodos · <strong>—</strong> aristas · <strong>—</strong> contradicciones
        </div>
      </div>

      <div class="panel__section">
        <h3>Leyenda</h3>
        <div class="legend">
          <div class="legend__item"><span class="legend__dot" style="background:#161632"></span> Documento</div>
          <div class="legend__item"><span class="legend__dot" style="background:#94a3b8"></span> Chunk</div>
          <div class="legend__item"><span class="legend__dot" style="background:#5B6AF5"></span> Entidad</div>
          <div class="legend__item"><span class="legend__dot" style="background:#f59e0b"></span> Claim</div>
          <div class="legend__item"><span class="legend__dot" style="background:#dc2626"></span> Chunk / Claim en disputa</div>
          <div class="legend__item"><span class="legend__dot" style="background:#ffffff;border:1px solid #cbd5e1"></span> Chunk / Claim superseded</div>
          <div class="legend__item" style="margin-top:6px;">
            <span style="width:22px;height:4px;background:#dc2626;display:inline-block;border-radius:2px;"></span>
            &nbsp; Arista <strong style="color:#dc2626;">contradice</strong>
          </div>
        </div>
      </div>

      <div class="panel__section">
        <h3>Contradicciones</h3>
        <div id="contradictions" class="contradiction-list">
          <div class="empty">Sin contradicciones para mostrar</div>
        </div>
      </div>
    </aside>
  </div>

<script>
'use strict'

const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8000' : ''

const TENANTS = {
  delos: {
    id: 'a0000000-0000-0000-0000-000000000001',
    name: 'Clínica Delos',
    users: [
      { id: 'a1000000-0000-0000-0000-000000000001', label: 'Admin (todos)' },
      { id: 'a2000000-0000-0000-0000-000000000001', label: 'Doctor (RRHH+Médico)' },
      { id: 'a3000000-0000-0000-0000-000000000001', label: 'Staff (RRHH)' },
    ],
  },
  garcia: {
    id: 'b0000000-0000-0000-0000-000000000002',
    name: 'Despacho García',
    users: [
      { id: 'b1000000-0000-0000-0000-000000000002', label: 'Admin (Casos+Fiscal)' },
      { id: 'b2000000-0000-0000-0000-000000000002', label: 'Lawyer (Casos)' },
    ],
  },
}

const $ = id => document.getElementById(id)

const tenantSelect = $('tenant-select')
const userSelect   = $('user-select')
const statusText   = $('status-text')
const statsBox     = $('stats')
const contraBox    = $('contradictions')

let network = null

const renderUsers = () => {
  const tenant = TENANTS[tenantSelect.value]
  userSelect.innerHTML = tenant.users
    .map((u, i) => `<option value="${u.id}" data-idx="${i}">${u.label}</option>`)
    .join('')
}

// Aplicar parámetros URL (?tenant=delos&user=0) si vienen desde la app
const applyUrlParams = () => {
  const params = new URLSearchParams(window.location.search)
  const tenantKey = params.get('tenant')
  const userIdx   = params.get('user')

  if (tenantKey && TENANTS[tenantKey]) {
    tenantSelect.value = tenantKey
    renderUsers()
  }
  if (userIdx !== null) {
    const tenant = TENANTS[tenantSelect.value]
    const idx = parseInt(userIdx, 10)
    if (tenant.users[idx]) {
      userSelect.value = tenant.users[idx].id
    }
  }
}

const renderGraph = async () => {
  const tenant = TENANTS[tenantSelect.value]
  const userId = userSelect.value
  statusText.textContent = 'Cargando grafo…'

  try {
    const [subRes, contraRes] = await Promise.all([
      fetch(`${API_BASE}/graph/subgraph?tenant_id=${tenant.id}&user_id=${userId}&limit=300`),
      fetch(`${API_BASE}/graph/contradictions?tenant_id=${tenant.id}&user_id=${userId}`),
    ])

    if (!subRes.ok) {
      const e = await subRes.json().catch(() => ({}))
      statusText.textContent = `Error: ${e.detail || subRes.statusText}`
      return
    }

    const sub = await subRes.json()
    const contras = contraRes.ok ? await contraRes.json() : { contradictions: [] }

    const nodeCount = (sub.nodes || []).length
    const edgeCount = (sub.edges || []).length

    // Limpiar el canvas si quedaba algo del render anterior
    if (network) { network.destroy(); network = null }

    if (nodeCount === 0) {
      statusText.textContent = `${TENANTS[tenantSelect.value].name} · sin datos en el grafo`
      statsBox.innerHTML = `<strong>0</strong> nodos · <strong>0</strong> aristas · <strong>0</strong> contradicciones`
      contraBox.innerHTML = '<div class="empty">Este usuario no tiene acceso a ningún nodo del grafo</div>'
      // Mensaje en el canvas en lugar de dejarlo en blanco
      $('network').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px;text-align:center;padding:32px;">Este usuario aún no tiene acceso a ningún nodo del grafo en este tenant.<br><br>Prueba con otro usuario o ingiere un documento.</div>'
      return
    }

    // Limpiar contenido HTML previo en el div del network (si lo había)
    $('network').innerHTML = ''

    // Asegurar que cada edge tiene un id estable: el highlight de
    // contradicciones llama a data.edges.update({id, ...}) para reescribir
    // propiedades. Sin id estable, vis.DataSet no encuentra la fila a actualizar.
    sub.edges.forEach((e, i) => { if (e.id == null) e.id = `e_${i}` })

    // Estado canónico inmutable del grafo (deep clone). Es la fuente de
    // verdad a la que SIEMPRE volvemos en clearHighlight, en lugar de
    // confiar en snapshots tomados durante hovers (que pueden contaminarse
    // entre transiciones).
    canonicalGraph = {
      nodes: JSON.parse(JSON.stringify(sub.nodes)),
      edges: JSON.parse(JSON.stringify(sub.edges)),
    }

    // Render network
    const data = {
      nodes: new vis.DataSet(sub.nodes),
      edges: new vis.DataSet(sub.edges),
    }
    const options = {
      nodes: {
        shape: 'dot',
        size: 10,
        font: { size: 11, color: '#1e293b', face: '-apple-system, sans-serif' },
        borderWidth: 1,
        scaling: { min: 8, max: 20 },
      },
      edges: {
        font: { size: 9, color: '#64748b', strokeWidth: 0, align: 'middle' },
        smooth: { type: 'continuous' },
      },
      physics: {
        barnesHut: {
          gravitationalConstant: -8000,
          springLength: 120,
          springConstant: 0.04,
          damping: 0.5,
          avoidOverlap: 0.1,
        },
        maxVelocity: 50,
        solver: 'barnesHut',
        timestep: 0.5,
        stabilization: { iterations: 80, fit: true },
      },
      interaction: {
        hover: true,
        navigationButtons: true,
        keyboard: true,
        tooltipDelay: 100,
      },
      layout: { improvedLayout: false },  // mucho más rápido con 200+ nodos
    }
    network = new vis.Network($('network'), data, options)

    // Cuando termina la simulación física, encuadra el viewport
    network.once('stabilizationIterationsDone', () => {
      network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } })
    })

    // También permitir doble clic para enfocar un nodo
    network.on('doubleClick', (params) => {
      if (params.nodes && params.nodes.length) {
        network.focus(params.nodes[0], { scale: 1.5, animation: true })
      }
    })

    // Stats
    statsBox.innerHTML = `<strong>${sub.stats.nodes}</strong> nodos · <strong>${sub.stats.edges}</strong> aristas · <strong>${contras.count || 0}</strong> contradicciones`

    // Contradicciones panel — clic/hover enlaza con la arista correspondiente en el lienzo
    if (!contras.contradictions || contras.contradictions.length === 0) {
      contraBox.innerHTML = '<div class="empty">Sin contradicciones para mostrar</div>'
    } else {
      contraBox.innerHTML = contras.contradictions.map((c, idx) => {
        const statusA = c.status_a === 'active' ? '✅' : c.status_a === 'disputed' ? '⚠️' : '⛔'
        const statusB = c.status_b === 'active' ? '✅' : c.status_b === 'disputed' ? '⚠️' : '⛔'
        const sim = c.similarity ? `${Math.round(c.similarity * 100)}%` : ''
        // data-from-id / data-to-id apuntan a los node_ids internos de FalkorDB,
        // que coinciden con los `id` de los nodos en el DataSet de vis-network.
        return `<div class="contradiction" data-idx="${idx}" data-from-id="${c.node_a_id ?? ''}" data-to-id="${c.node_b_id ?? ''}">
          <div class="contradiction__pred">${escapeHtml(c.subject)} → ${escapeHtml(c.predicate)} ${sim ? `<em>(${sim})</em>` : ''}</div>
          <div class="contradiction__vals">${statusA} ${escapeHtml(c.value_a)}<br>${statusB} ${escapeHtml(c.value_b)}</div>
          <div class="contradiction__hint">Pasa el ratón para resaltar la arista · Clic para enfocar</div>
        </div>`
      }).join('')
      // Bindings hover/click. Usamos mousemove + mouseleave a nivel del
      // contenedor (no por item) para evitar bugs de eventos perdidos cuando
      // el cursor pasa rápido entre items o entra/sale por bordes raros
      // (e.g. al aparecer el .contradiction__hint cambia el bounding box).
      let currentHoverItem = null
      const isStickyActive = () => contraBox.querySelector('.contradiction.is-active') !== null
      contraBox.addEventListener('mousemove', (ev) => {
        if (isStickyActive()) return  // mientras hay clic fijo, no procesar hover
        const item = ev.target.closest('.contradiction')
        if (item === currentHoverItem) return
        currentHoverItem = item
        if (item) {
          const { fromId, toId } = item.dataset
          if (fromId && toId) highlightContradictionEdge(fromId, toId)
        } else {
          clearHighlight()
        }
      })
      contraBox.addEventListener('mouseleave', () => {
        if (isStickyActive()) return
        currentHoverItem = null
        clearHighlight()
      })
      // Clic sigue siendo por item (sticky)
      contraBox.querySelectorAll('.contradiction').forEach(el => {
        const fromId = el.dataset.fromId, toId = el.dataset.toId
        if (!fromId || !toId) return
        el.addEventListener('click', (ev) => {
          ev.stopPropagation()
          currentHoverItem = null
          focusContradictionEdge(el, fromId, toId)
        })
      })
    }

    statusText.textContent = `${TENANTS[tenantSelect.value].name} · ${sub.stats.nodes} nodos`
  } catch (err) {
    statusText.textContent = 'Error: ' + err.message
    console.error(err)
  }
}

const escapeHtml = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

// ── Resaltado de aristas CONTRADICTS desde el panel lateral ────────────────
// Cuando se hace hover/clic sobre una contradicción del sidebar, atenuamos
// todo el grafo excepto los dos claims contradictorios + su arista. Esto
// resuelve el problema de "las 500 aristas grises tapan las 2 rojas" cuando
// los claims están en una zona densa del layout.

// Estado canónico del grafo (deep clone de sub.nodes/sub.edges tal como
// vinieron del backend). Se rellena en renderGraph(). Sirve como fuente
// inmutable a la que SIEMPRE volvemos en clearHighlight. Antes usaba un
// snapshot tomado por hover y el bug "scale enganchado" venía de que ese
// snapshot podía contaminarse con propiedades del highlight previo.
let canonicalGraph = null
// Marca booleana de si hay un highlight activo, para early-return rápido
// en clearHighlight cuando no hay nada que limpiar.
let highlightActive = false

function highlightContradictionEdge(fromId, toId) {
  if (!network) return
  // Si ya había un highlight activo, deshacerlo PRIMERO para garantizar
  // un punto de partida limpio.
  if (highlightActive) clearHighlight()

  const data = network.body.data
  const fromN = Number(fromId), toN = Number(toId)
  highlightActive = true

  // Atenuar todos los nodos excepto los dos extremos
  data.nodes.update(data.nodes.getIds().map(id => ({
    id,
    color: (id === fromN || id === toN)
      ? { background: '#dc2626', border: '#7f1d1d' }
      : { background: 'rgba(203, 213, 225, 0.25)', border: 'rgba(148, 163, 184, 0.25)' },
    font: (id === fromN || id === toN)
      ? { size: 16, color: '#7f1d1d', face: '-apple-system, sans-serif', strokeWidth: 4, strokeColor: '#ffffff', bold: true }
      : { size: 11, color: 'rgba(30, 41, 59, 0.2)' },
    borderWidth: (id === fromN || id === toN) ? 3 : 1,
    size: (id === fromN || id === toN) ? 20 : 10,
  })))

  // Atenuar todas las aristas excepto la que conecta los dos claims
  data.edges.update(data.edges.get().map(e => {
    const isTheOne = (e.from === fromN && e.to === toN) || (e.from === toN && e.to === fromN)
    return {
      id: e.id,
      color: isTheOne
        ? { color: '#dc2626', highlight: '#dc2626' }
        : { color: 'rgba(203, 213, 225, 0.12)', highlight: 'rgba(203, 213, 225, 0.12)' },
      width: isTheOne ? 8 : 1,
      label: isTheOne ? '⚠️ contradice' : '',
    }
  }))
}

function clearHighlight() {
  if (!network || !canonicalGraph || !highlightActive) return
  // Tras múltiples intentos con DataSet.update + body.nodes.setOptions + redraw
  // que demostraron NO resetear propiedades anidadas (font.bold:true se queda
  // pegado), la única forma fiable de limpiar el estado es CLEAR + ADD del
  // DataSet con los datos canónicos. Eso destruye y recrea las instancias
  // internas de vis para los nodos/aristas, garantizando estado limpio.
  //
  // Capturamos las posiciones actuales antes para reinyectarlas como `x`/`y`
  // explícitos: si no, el alta vuelve a ponerlos en (0,0) y la física los
  // dispara desde el centro.
  const data = network.body.data
  const positions = network.getPositions()

  data.nodes.clear()
  data.nodes.add(canonicalGraph.nodes.map(n => ({
    ...n,
    x: positions[n.id]?.x,
    y: positions[n.id]?.y,
  })))
  data.edges.clear()
  data.edges.add(canonicalGraph.edges)

  highlightActive = false
}

function focusContradictionEdge(el, fromId, toId) {
  if (!network) return
  // Marcar el item activo en el sidebar (toggle)
  document.querySelectorAll('.contradiction.is-active').forEach(d => d.classList.remove('is-active'))
  el.classList.add('is-active')
  // Aplicar el highlight (queda fijado aunque salgas con el ratón)
  highlightContradictionEdge(fromId, toId)
  // Encuadrar los dos nodos en el viewport
  network.fit({
    nodes: [Number(fromId), Number(toId)],
    animation: { duration: 600, easingFunction: 'easeInOutQuad' },
  })
  // Clic fuera del sidebar limpia el highlight
  const offClick = (ev) => {
    if (!el.contains(ev.target)) {
      el.classList.remove('is-active')
      clearHighlight()
      document.removeEventListener('click', offClick)
    }
  }
  setTimeout(() => document.addEventListener('click', offClick), 100)
}


tenantSelect.addEventListener('change', () => { renderUsers(); renderGraph() })
userSelect.addEventListener('change', renderGraph)

renderUsers()
applyUrlParams()
renderGraph()
</script>

</body>
</html>
