# korio.es — proxy a FastAPI (sirve UI + API)
# Certbot añade el bloque SSL automáticamente al ejecutar:
#   certbot --nginx -d korio.es -d www.korio.es

server {
    listen 80;
    server_name korio.es www.korio.es;

    # Tamaño máximo de upload (para /upload endpoint)
    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # Mistral API puede tardar ~3s, margen amplio
    }
}
