version: '3.8'

services:
  # Ollama - Local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: korio-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FalkorDB - Graph store
  falkordb:
    image: falkordb/falkordb:latest
    container_name: korio-falkordb
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --save 60 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres - Local development (optional, for testing RLS locally)
  postgres:
    image: postgres:15-alpine
    container_name: korio-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=korio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-korio}
      - POSTGRES_DB=korio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korio"]
      interval: 10s
      timeout: 5s
      retries: 5

  # n8n - Automatización de workflows
  n8n:
    image: n8nio/n8n:latest
    container_name: korio-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"  # solo localhost, nginx hace de proxy
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.korio.es}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.korio.es/}
      - N8N_LOG_LEVEL=info
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"  # acceso a FastAPI en el host

  # Jaeger - Trazas distribuidas OTLP (sesión 18, observabilidad OTel)
  # korio-api corre en el host (systemd) y exporta a 127.0.0.1:4317 (OTLP gRPC).
  # UI en 127.0.0.1:16686 → acceder vía túnel SSH: ssh -L 16686:localhost:16686 korio-vps
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: korio-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "127.0.0.1:16686:16686"  # UI web
      - "127.0.0.1:4317:4317"    # OTLP gRPC (receptor de spans)
      - "127.0.0.1:4318:4318"    # OTLP HTTP (alternativa)

volumes:
  ollama_data:
  falkordb_data:
  postgres_data:
  n8n_data:

networks:
  default:
    name: korio-net
