version: '3.8'

services:
  # Ollama - Local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: korio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FalkorDB - Graph store
  falkordb:
    image: falkordb/falkordb:latest
    container_name: korio-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres - Local development (optional, for testing RLS locally)
  postgres:
    image: postgres:15-alpine
    container_name: korio-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=korio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-korio}
      - POSTGRES_DB=korio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
  falkordb_data:
  postgres_data:

networks:
  default:
    name: korio-net
